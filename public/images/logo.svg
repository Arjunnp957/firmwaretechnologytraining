    <path d="M14 26L19 22L14 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 28H30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
